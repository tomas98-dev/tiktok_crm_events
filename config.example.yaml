# =============================================================================
# Configuración del pipeline BigQuery -> TikTok CRM Events API
# -----------------------------------------------------------------------------
# Copie este archivo como config.yaml y complete los valores marcados con  <<< .
# Todo lo que el cliente necesita ajustar está en este archivo: proyecto,
# dataset, tabla de origen, mapeo de estados a eventos y la tabla de control.
# El Access Token NO va aquí: se entrega por variable de entorno (ver README).
# =============================================================================

gcp:
  # ID del proyecto de GCP donde vive BigQuery.
  project_id: "<<< su-proyecto-gcp >>>"
  # Ubicación del dataset (ej. "US", "southamerica-west1"). Debe coincidir con
  # la región real del dataset, o las consultas fallan.
  bq_location: "US"

tiktok:
  # Endpoint oficial de TikTok Events API v1.3. No cambiar salvo indicación.
  api_url: "https://business-api.tiktok.com/open_api/v1.3/event/track/"
  # CRM Event Set ID obtenido en Events Manager (esquina superior izquierda
  # al crear el event set de tipo CRM).
  event_set_id: "<<< EVENT_SET_ID >>>"
  # --- Access Token: elija UNA de estas opciones ---
  #
  # Opción A (RECOMENDADA, Cloud Run): el token llega por la variable de entorno
  # TIKTOK_ACCESS_TOKEN, que Cloud Run inyecta desde Secret Manager con
  # --set-secrets. No descomente nada aquí.
  #
  # Opción B: que el CÓDIGO lea Secret Manager directamente. Descomente y ponga
  # el nombre del secreto. Requiere el rol secretmanager.secretAccessor.
  # secret_name: "tiktok-access-token"
  # secret_project: ""        # opcional; por defecto usa gcp.project_id
  # secret_version: "latest"
  #
  # Opción C (NO recomendada): token en texto plano aquí mismo.
  # access_token: "pega-el-token-solo-si-no-usa-ninguna-de-las-anteriores"

  # Cantidad de eventos por request (máximo soportado por TikTok: 1000).
  batch_size: 1000
  # Código de prueba opcional. Si lo completa, los eventos se marcan como de
  # prueba y aparecen en "Test Events" de Events Manager SIN afectar datos
  # reales. Déjelo vacío ("") en producción.
  test_event_code: ""

# -----------------------------------------------------------------------------
# ORIGEN DE DATOS
# -----------------------------------------------------------------------------
# Aquí el cliente define QUÉ datos se envían. La consulta debe devolver estas
# columnas con estos nombres exactos (alias):
#
#   event_name   (STRING)    nombre del evento ya mapeado para TikTok
#   event_time   (TIMESTAMP) momento del cambio de estado / conversión
#   phone        (STRING)    teléfono en crudo  (opcional pero recomendado)
#   email        (STRING)    correo en crudo    (opcional)
#   lead_id      (STRING)    TikTok Lead ID     (opcional; mejor match si existe)
#   external_id  (STRING)    ID propio del CRM  (opcional)
#   ttclid       (STRING)    click id de TikTok (opcional; mejora match en pago)
#   value        (NUMERIC)   valor de la conversión (opcional)
#   currency     (STRING)    moneda ISO 4217, ej. "PEN" (opcional)
#
# Columnas que no aplican: devuélvalas como NULL o no las incluya.
# Al menos UNO de phone / email / lead_id debe venir con dato por fila.
# -----------------------------------------------------------------------------
source:
  query: |
    SELECT
      PHONE                                   AS phone,       -- SHA-256 ya hasheado en origen
      EMAIL                                   AS email,       -- SHA-256 ya hasheado en origen
      LEAD_ID                                 AS external_id, -- Id de Salesforce (el pipeline lo hashea)
      CAST(NULL AS STRING)                    AS lead_id,     -- reservado para TikTok Lead ID (no aplica)
      -- Click id de TikTok: solo cuando la procedencia es TikTok (no se hashea).
      CASE
        WHEN UPPER(Lead_Procedencia_landing__c) LIKE '%TIKTOK%'
        THEN NULLIF(TRIM(Lead_id_click__c), '')
      END                                     AS ttclid,
      'Postulante'                            AS event_name,  -- evento de conversión (ver diccionario)
      -- Las fechas vienen como texto 'YYYY-MM-DD HH:MM:SS' en UTC.
      SAFE.PARSE_TIMESTAMP('%Y-%m-%d %H:%M:%S',
                           Opportunity_Fecha_cambio_Postulante__c) AS event_time,
      CAST(NULL AS NUMERIC)                   AS value,       -- esta tabla no trae valor de conversión
      CAST(NULL AS STRING)                    AS currency
    FROM `analista-gga-dap.UCV_RECURSOS_DIGITALES.SF_CAPI`
    WHERE Opportunity_Fecha_cambio_Postulante__c IS NOT NULL
      AND (PHONE IS NOT NULL OR EMAIL IS NOT NULL)

# -----------------------------------------------------------------------------
# IDENTIDAD / NORMALIZACIÓN
# -----------------------------------------------------------------------------
identity:
  # Código de país por defecto para teléfonos que vengan sin prefijo
  # internacional. Perú = "51". Se antepone antes de hashear a E.164.
  # (Solo aplica cuando los teléfonos vienen en crudo; ver flag de abajo.)
  default_country_code: "51"
  # Si los identificadores (phone/email) YA vienen hasheados con SHA-256 desde
  # el origen (caso SF_CAPI), poner true para que el pipeline NO los vuelva a
  # hashear. external_id siempre se hashea en el pipeline.
  identifiers_already_hashed: true

# -----------------------------------------------------------------------------
# TABLA DE CONTROL (idempotencia)
# -----------------------------------------------------------------------------
# Registra cada evento enviado para no duplicar envíos. La crea el propio
# script si no existe. Debe estar en un dataset donde el script pueda escribir.
control:
  dataset: "<<< su_dataset >>>"
  table: "tiktok_events_enviados"
